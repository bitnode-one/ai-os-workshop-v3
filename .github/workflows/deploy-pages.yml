name: Deploy workshop to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install PDF build dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build handout PDFs
        run: npm run build:pdf

      - name: Validate workshop
        run: |
          npm run check
          npm run check:governance

      - name: Build static Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets handouts _site/
          cp README.md CHANGELOG.md _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
