<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Klare Architektur eines persönlichen KI-Betriebssystems">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16395c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7897a3"/></marker>
    <linearGradient id="core" x1="0" x2="1"><stop stop-color="#dff3f0"/><stop offset="1" stop-color="#fff3cf"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="38" fill="#fffdf8"/>
  <text x="62" y="64" fill="#12324a" font-family="Arial, sans-serif" font-size="34" font-weight="800">AI OS / KI-OS</text>
  <text x="62" y="96" fill="#5d7180" font-family="Arial, sans-serif" font-size="18">Ein Agenten-Harness verbindet Menschen, Wissen, Modelle und Werkzeuge.</text>

  <!-- connectors -->
  <g fill="none" stroke="#7897a3" stroke-width="5" marker-end="url(#arrow)">
    <path d="M600 182V225"/>
    <path d="M430 335H350"/>
    <path d="M770 335H850"/>
    <path d="M430 408L350 492"/>
    <path d="M770 408L850 492"/>
    <path d="M600 445V512"/>
  </g>

  <!-- user -->
  <g filter="url(#s)">
    <rect x="430" y="112" width="340" height="70" rx="22" fill="#fff" stroke="#138a8a" stroke-width="4"/>
    <text x="600" y="143" text-anchor="middle" fill="#12324a" font-family="Arial, sans-serif" font-size="22" font-weight="800">MENSCH + KANÄLE</text>
    <text x="600" y="168" text-anchor="middle" fill="#5d7180" font-family="Arial, sans-serif" font-size="16">Chat · Sprache · Desktop</text>
  </g>

  <!-- center -->
  <g filter="url(#s)">
    <rect x="430" y="225" width="340" height="220" rx="34" fill="url(#core)" stroke="#138a8a" stroke-width="6"/>
    <circle cx="600" cy="294" r="42" fill="#fff" stroke="#12324a" stroke-width="5"/>
    <path d="M575 295l17 17 35-43" fill="none" stroke="#138a8a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="365" text-anchor="middle" fill="#12324a" font-family="Arial, sans-serif" font-size="31" font-weight="900">AGENTEN-HARNESS</text>
    <text x="600" y="398" text-anchor="middle" fill="#5d7180" font-family="Arial, sans-serif" font-size="18">plant · verbindet · kontrolliert</text>
    <rect x="500" y="414" width="200" height="38" rx="19" fill="#12324a"/>
    <text x="600" y="439" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">REGELN + LOOPS</text>
  </g>

  <!-- left and right -->
  <g filter="url(#s)" font-family="Arial, sans-serif">
    <rect x="70" y="265" width="280" height="140" rx="25" fill="#eaf6f4" stroke="#7ab8b2" stroke-width="4"/>
    <text x="102" y="307" fill="#12324a" font-size="25" font-weight="800">KONTEXT</text>
    <text x="102" y="341" fill="#5d7180" font-size="18">Ziel · Regeln · Dateien</text>
    <text x="102" y="372" fill="#5d7180" font-size="18">Was jetzt relevant ist</text>

    <rect x="850" y="265" width="280" height="140" rx="25" fill="#fff3cf" stroke="#e2ae5f" stroke-width="4"/>
    <text x="882" y="307" fill="#12324a" font-size="25" font-weight="800">MODELLE</text>
    <text x="882" y="341" fill="#5d7180" font-size="18">Cloud · Open Source · lokal</text>
    <text x="882" y="372" fill="#5d7180" font-size="18">Denken und Sprache</text>

    <rect x="70" y="492" width="280" height="130" rx="25" fill="#eaf6f4" stroke="#7ab8b2" stroke-width="4"/>
    <text x="102" y="534" fill="#12324a" font-size="25" font-weight="800">WISSEN</text>
    <text x="102" y="568" fill="#5d7180" font-size="18">Memory · Second Brain · RAG</text>
    <text x="102" y="599" fill="#5d7180" font-size="18">Erinnern und Nachschlagen</text>

    <rect x="850" y="492" width="280" height="130" rx="25" fill="#eef3df" stroke="#80a45a" stroke-width="4"/>
    <text x="882" y="534" fill="#12324a" font-size="25" font-weight="800">WERKZEUGE</text>
    <text x="882" y="568" fill="#5d7180" font-size="18">Tools · Skills · MCP</text>
    <text x="882" y="599" fill="#5d7180" font-size="18">Rechnen, suchen, bearbeiten</text>
  </g>

  <!-- human gate -->
  <g filter="url(#s)">
    <rect x="430" y="512" width="340" height="110" rx="28" fill="#ffe8e2" stroke="#e86a55" stroke-width="4"/>
    <text x="600" y="554" text-anchor="middle" fill="#12324a" font-family="Arial, sans-serif" font-size="25" font-weight="800">MENSCHLICHE FREIGABE</text>
    <text x="600" y="589" text-anchor="middle" fill="#5d7180" font-family="Arial, sans-serif" font-size="18">prüfen · erlauben · stoppen</text>
  </g>
</svg>
